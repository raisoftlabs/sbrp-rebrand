name: Recon theme + colors

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'base release tag'
        default: 'v0.3.1'
        required: true

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: apktool
        run: |
          TAG=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          curl -sL -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/${TAG}/apktool_${TAG#v}.jar"

      - name: base apk
        run: |
          curl -L --fail -o base.apk \
            "https://github.com/SA-MP-Android/App/releases/download/${{ github.event.inputs.base_tag }}/app-arm64-v8a-release.apk"

      - name: FULL decode (with smali)
        run: java -jar apktool.jar d -f base.apk -o full

      - name: Dump res colors/styles
        run: |
          for f in full/res/values/colors.xml full/res/values/styles.xml full/res/values/themes.xml; do
            echo "########## $f ##########"
            [ -f "$f" ] && cat "$f" || echo "(missing)"
          done
          echo "########## values dirs ##########"
          ls full/res/values*/ 2>/dev/null | head -40

      - name: Dump app smali layout
        run: |
          echo '########## smali dirs ##########'
          ls -d full/smali* 2>/dev/null
          echo '########## app classes (top/th1nk) ##########'
          find full/smali* -path '*top/th1nk*' -name '*.smali' 2>/dev/null | head -80
          echo '########## theme/color class names ##########'
          find full/smali* -iname '*Color*.smali' -o -iname '*Theme*.smali' 2>/dev/null | grep -i 'th1nk' | head -40

      - name: Dump color scheme usage
        run: |
          echo '########## files referencing lightColorScheme/darkColorScheme/dynamic ##########'
          grep -rl 'lightColorScheme\|darkColorScheme\|dynamicLightColorScheme\|dynamicDarkColorScheme' full/smali* 2>/dev/null | head -30
          echo '########## ColorSchemeKt present? ##########'
          find full/smali* -iname 'ColorSchemeKt.smali' | head
          echo '########## the app Color.kt-equivalent (static color fields) ##########'
          for f in $(find full/smali* -path '*top/th1nk*' -iname '*Color*.smali' 2>/dev/null | head -5); do
            echo "===== $f ====="
            grep -nE 'const|sput|sget' "$f" | head -80
          done

      - name: Dump theme Kt smali
        run: |
          for f in $(find full/smali* -path '*top/th1nk*' \( -iname '*Theme*.smali' -o -iname '*Color*.smali' \) 2>/dev/null | head -6); do
            echo "########## $f ##########"
            cat "$f"
          done
